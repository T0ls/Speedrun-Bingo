<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speedrun Bingo Card</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script src="bingoData.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body data-page="card">
  <main class="page card-page">
    <section class="card-toolbar panel" aria-label="Speedrun controls">
      <div class="card-toolbar__timer-block">
        <p class="eyebrow">Speedrun timer</p>
        <div class="card-timer" id="speedrunTimer" aria-live="polite">00:00:00</div>
      </div>

      <button class="primary-button card-end-button" id="endSpeedrunButton" type="button">END SPEEDRUN!</button>

      <button class="secondary-button card-pause-button" id="pauseSpeedrunButton" type="button" aria-label="Pause speedrun" title="Pause speedrun">||</button>
    </section>

    <section class="card-board panel">
      <div class="card-meta-bar">
        <div>
          <p class="section-label">Bingo table</p>
          <h1 class="section-title card-title">Generated card</h1>
        </div>

        <div class="card-meta">
          <span id="Tdtype">Normal</span>
          <span id="cardSeedLabel">Seed: random</span>
        </div>
      </div>

      <div class="card-board-content">
        <div class="board-wrap">
          <table id="bingo" aria-label="Speedrun bingo board">
            <tbody>
              <tr>
                <td class="popout" id="tlbr">TL-BR</td>
                <td class="popout" id="col1">COL1</td>
                <td class="popout" id="col2">COL2</td>
                <td class="popout" id="col3">COL3</td>
                <td class="popout" id="col4">COL4</td>
                <td class="popout" id="col5">COL5</td>
              </tr>
              <tr>
                <td class="popout" id="row1">ROW1</td>
                <td class="row1 col1 tlbr" id="slot1"></td>
                <td class="row1 col2" id="slot2"></td>
                <td class="row1 col3" id="slot3"></td>
                <td class="row1 col4" id="slot4"></td>
                <td class="row1 col5 bltr" id="slot5"></td>
              </tr>
              <tr>
                <td class="popout" id="row2">ROW2</td>
                <td class="row2 col1" id="slot6"></td>
                <td class="row2 col2 tlbr" id="slot7"></td>
                <td class="row2 col3" id="slot8"></td>
                <td class="row2 col4 bltr" id="slot9"></td>
                <td class="row2 col5" id="slot10"></td>
              </tr>
              <tr>
                <td class="popout" id="row3">ROW3</td>
                <td class="row3 col1" id="slot11"></td>
                <td class="row3 col2" id="slot12"></td>
                <td class="row3 col3 tlbr bltr" id="slot13"></td>
                <td class="row3 col4" id="slot14"></td>
                <td class="row3 col5" id="slot15"></td>
              </tr>
              <tr>
                <td class="popout" id="row4">ROW4</td>
                <td class="row4 col1" id="slot16"></td>
                <td class="row4 col2 bltr" id="slot17"></td>
                <td class="row4 col3" id="slot18"></td>
                <td class="row4 col4 tlbr" id="slot19"></td>
                <td class="row4 col5" id="slot20"></td>
              </tr>
              <tr>
                <td class="popout" id="row5">ROW5</td>
                <td class="row5 col1 bltr" id="slot21"></td>
                <td class="row5 col2" id="slot22"></td>
                <td class="row5 col3" id="slot23"></td>
                <td class="row5 col4" id="slot24"></td>
                <td class="row5 col5 tlbr" id="slot25"></td>
              </tr>
              <tr>
                <td class="popout" id="bltr">BL-TR</td>
                <td colspan="5" style="display:none;"></td>
              </tr>
            </tbody>
          </table>
        </div>

        <section class="card-splits" aria-label="Run splits">
          <div class="card-splits__header">
            <h2 class="section-title card-splits__title">Completed goals</h2>
          </div>

          <p class="card-splits__empty" id="completedGoalsEmpty">No goals completed yet.</p>

          <ul class="completed-goals-list" id="completedGoalsList" aria-label="Completed goals and completion times"></ul>
        </section>
      </div>
    </section>

    <section class="card-penalties panel">
      <div class="card-penalties__header">
        <p class="section-label">Selected penalties</p>
        <h2 class="section-title card-penalties__title">Penalty summary</h2>
      </div>

      <p class="card-penalties__empty" id="selectedPenaltiesEmpty">No penalties selected for this run.</p>

      <ul class="selected-penalties-list" id="selectedPenaltiesList" aria-label="Selected penalties"></ul>
    </section>

  </main>
</body>
</html>
